name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  test-build-docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Build distributions
        if: matrix.python-version == '3.13'
        run: |
          python scripts/clean_build_artifacts.py
          python -m build --sdist --wheel --no-isolation

      - name: Validate distributions
        if: matrix.python-version == '3.13'
        run: |
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist

      - name: Smoke install wheel
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m venv /tmp/proofofthought-ci-smoke
          /tmp/proofofthought-ci-smoke/bin/pip install --upgrade pip
          /tmp/proofofthought-ci-smoke/bin/pip install dist/*.whl
          /tmp/proofofthought-ci-smoke/bin/python -c "import proofofthought, z3adapter; print(proofofthought.__version__); assert proofofthought.__version__ == z3adapter.__version__"

      - name: Build stable documentation
        if: matrix.python-version == '3.13'
        run: mkdocs build --clean --site-dir site

      - name: Build v1.0.1 documentation
        if: matrix.python-version == '3.13'
        run: mkdocs build -f mkdocs-v1.0.1.yml --clean --site-dir site/v1.0.1

      - name: Build nightly documentation
        if: matrix.python-version == '3.13'
        run: mkdocs build -f mkdocs-nightly.yml --clean --site-dir site/nightly
