[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "proofofthought"
dynamic = ["version"]
description = "LLM-based reasoning using Z3 theorem proving"
readme = "README.md"
authors = [{name = "Debargha Ganguly", email = "debargha@case.edu"}]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["llm", "reasoning", "z3", "theorem-proving", "smt", "ai"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "z3-solver>=4.15.0",
    "openai>=2.0.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.9.0",
    "build>=1.3.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "ruff>=0.13.0",
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pymdown-extensions>=10.0.0",
    "pytest>=8.0.0",
    "setuptools>=61.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/debarghaG/proofofthought"
Documentation = "https://debarghaG.github.io/proofofthought"
Repository = "https://github.com/debarghaG/proofofthought"
"Bug Tracker" = "https://github.com/debarghaG/proofofthought/issues"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
# Ruff is used for linting; Black remains the formatter.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Core rule sets: pycodestyle/pyflakes/imports/pyupgrade/bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203", "E501"]

[tool.setuptools.packages.find]
include = ["proofofthought*", "z3adapter*"]

[tool.setuptools.dynamic]
version = {file = ["z3adapter/VERSION"]}

[tool.setuptools.package-data]
z3adapter = ["py.typed", "VERSION"]
proofofthought = ["py.typed"]

[tool.mypy]
python_version = "3.10"
# Reasonable strictness for a new integration
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Many ML/DS libs lack type hints; relax imports to avoid noise
ignore_missing_imports = true
# Skip virtual environment
exclude = "(env|venv)/"
